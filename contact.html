<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Le Nguyen Khanh Duy</title>
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    <div id="header"></div>
    <div class="main">
        <section class="section">
            <div class="contact-container">
                <div class="contact-left">
                    <div class="contact-box"><i class="fa-solid fa-envelope"></i> Email</div>
                    <div class="contact-box"><i class="fa-solid fa-phone"></i> Call Me</div>
                    <div class="contact-box"><i class="fa-brands fa-telegram"></i> Telegram</div>
                    <div class="contact-box"><i class="fa-solid fa-comment-dots"></i> Zalo</div>
                </div>

                <div class="contact-right">
                    <h3>Let's Work Together!</h3>
                    <p>I'm passionate about creating scalable solutions. Let's collaborate.</p>
                    <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                    <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <div id="footer"></div>
</body>
<script src="js/script.js"></script>
</html>
